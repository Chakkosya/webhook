services:
  browser-workflow:
    image: ghcr.io/chakkosya/webhook:latest
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    ports:
      - "${WORKFLOW_BIND:-127.0.0.1}:${WORKFLOW_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /app/.data/workflow
      SITE_USERNAME: ${SITE_USERNAME:-}
      SITE_PASSWORD: ${SITE_PASSWORD:-}
      AI_ENDPOINT: ${AI_ENDPOINT:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
    volumes:
      - workflow_data:/app/.data
volumes:
  workflow_data:
