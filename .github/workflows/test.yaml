name: Test and publish workflow engine

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: npm run test:safety
      - run: npm test
      - run: docker compose config -q
      - run: docker compose -f compose.build.yaml config -q
      - run: bash -n install.sh
      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t browser-workflow:test .
      - name: Verify bundled browser with a read-only root filesystem
        run: |
          docker run --rm --read-only --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 \
            --entrypoint xvfb-run browser-workflow:test -a node --input-type=module -e \
            "import {chromium} from 'playwright-core'; const context=await chromium.launchPersistentContext('/app/.data/smoke',{headless:false,executablePath:process.env.BROWSER_EXECUTABLE}); const page=await context.newPage(); await page.setContent('<p id=ok>ready</p>'); if(await page.locator('#ok').textContent()!=='ready')process.exitCode=1; await context.close();"
      - name: Verify container startup and dashboard
        run: |
          docker run -d --name workflow-smoke --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 \
            -p 127.0.0.1:3000:3000 browser-workflow:test
          trap 'docker logs workflow-smoke; docker rm -fv workflow-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then break; fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const health=await fetch('http://127.0.0.1:3000/api/health');
          assert.equal(health.status,200);
          assert.equal((await health.json()).status,'ok');
          const status=await(await fetch('http://127.0.0.1:3000/api/status')).json();
          assert.equal(status.configured,false);
          for(const path of ['/','/app.js','/style.css']) {
            const response=await fetch('http://127.0.0.1:3000'+path);
            assert.equal(response.status,200,path);
            assert.ok((await response.text()).length>0,path);
          }
          JS
      - name: Publish to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/order-workflow-compatibility')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="sha-${GITHUB_SHA:0:12}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag browser-workflow:test "$IMAGE:$VERSION"
          docker tag browser-workflow:test "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          printf 'Published `%s:%s` and `%s:latest`\n' "$IMAGE" "$VERSION" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
